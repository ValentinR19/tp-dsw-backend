version: '3.1'

services:
  tp-dsw-backend:
    build: ./
    ports:
      - ${PORT}:3000
    volumes:
      - ./src:/usr/src/app/src
    command: npm run start:dev
    environment:
      - PORT=${PORT}
      - ORIGIN=${ORIGIN}
      - URL=${URL}
      - IS_PRODUCTION=${IS_PRODUCTION}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    networks:
      - wave_network

networks:
  wave_network:
    driver: bridge
